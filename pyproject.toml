[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-cl"
version = "0.1.0"
description = "Continual learning coding agent for repository-level issue repair."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "KangarooKi" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
repopilot-run-task = "repopilot.cli.run_task:main"

[tool.setuptools.packages.find]
include = ["repopilot*"]

